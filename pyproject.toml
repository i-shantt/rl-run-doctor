[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-run-doctor"
version = "0.0.1.dev0"
description = "Names why a reinforcement-learning training run failed, from its logs and checkpoints."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The testbed that generates the labeled corpus. Never a dependency of the shipped package.
testbed = ["torch>=2.0"]
analysis = ["scikit-learn>=1.3", "scipy>=1.10", "matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
rl-run-doctor = "rl_run_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
